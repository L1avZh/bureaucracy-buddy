server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxied to the backend container in docker-compose so the browser only
    # ever talks to one origin (no CORS needed). Behind a different topology
    # (e.g. frontend and backend on separate hosts), skip this block and set
    # VITE_API_URL at build time instead.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are safe to cache forever; index.html and the
    # service worker must always be revalidated so updates and PWA-shell
    # changes actually reach returning visitors.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
