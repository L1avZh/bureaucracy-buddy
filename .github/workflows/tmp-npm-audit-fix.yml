# TEMPORARY — removed again before this PR is merged.
# Regenerates frontend/package-lock.json with `npm audit fix` (non-forced,
# semver-compatible updates only) on a runner and commits it to the PR branch.
name: tmp-npm-audit-fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  audit-fix:
    if: github.head_ref == 'fix/ci-dependency-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit fix
        working-directory: frontend
        run: |
          npm audit fix || true
          git diff --stat
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/package.json
          git diff --cached --quiet && { echo "::error::npm audit fix changed nothing"; exit 1; }
          git commit -m "fix(deps): npm audit fix (source-map-js, brace-expansion)"
          git push origin HEAD:${{ github.head_ref }}
